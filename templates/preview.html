<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SmartDocAI</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>
<div id="loader">

<div class="spinner"></div>

<p>Generating Professional Document...</p>

</div>
<nav>

<div class="logo">

<i class="fa-solid fa-file-word"></i>

SmartDocAI

</div>

<ul>

<li><a href="/">Home</a></li>

<li><a href="#">Features</a></li>

<li><a href="#">Support</a></li>

</ul>

</nav>


<section class="form-section">

<div class="form-card large-card">

<div class="progress">

<div class="progress-bar progress75"></div>

</div>

<h1>

Write Your Content

</h1>

<p>

Enter the content for every section.

</p>

<form action="/generate" method="POST">

<input
type="hidden"
name="title"
value="{{ title }}">

{% for section in sections %}

<input
type="hidden"
name="section_name"
value="{{ section }}">

<label>

{{ section }}

</label>

<textarea

name="content"

rows="8"

placeholder="Write {{ section }} here..."

required>

</textarea>

{% endfor %}

<button type="submit">

<i class="fa-solid fa-file-word"></i>

Generate Word Document

</button>

</form>

</div>

</section>

<footer>

<p>

© 2026 SmartDocAI

</p>

</footer>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>

</html>
